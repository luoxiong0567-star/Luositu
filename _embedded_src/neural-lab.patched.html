<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>神经网络推理 · Neural Inference</title>
<style>
/* Layout: 深空蓝推理大屏 —— 顶栏状态轨 / 中部多层全连接网络（左侧训练参数输入列 + 右侧推理轨迹）/ 底栏参数统计。
   视觉：深空渐变 + 透视网格 + 星尘粒子 + 霓虹青绿光线；节点按层依次点亮，信号光点沿连线流动。
   输入层为大模型训练参数（28 项参数池），输出层为训练诊断；顶栏「宽度」控件按比例调节各层节点数（上限 28）。 */
:root{
  color-scheme:dark;
  --bg:#04080f; --bg2:#071527; --panel:rgba(7,18,32,.82);
  --ink:#dcf3ff; --ink2:#9fc4d8; --dim:#5f8199; --mute:#33506a;
  --cy:#45e6f5; --gr:#3ff0c0; --pu:#a06bff; --or:#ffb054; --rd:#ff5f7e; --bl:#4f9dff;
  --hair:rgba(90,180,220,.16); --hair2:rgba(90,180,220,.28);
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --cjk:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 90% at 32% 18%,#0a1e36 0%,var(--bg2) 42%,var(--bg) 100%);
  color:var(--ink);font-family:var(--mono);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

/* ---------- 顶栏 ---------- */
header{position:relative;z-index:6;display:flex;align-items:center;gap:16px;
  padding:12px 18px 11px;border-bottom:1px solid var(--hair);
  background:linear-gradient(180deg,rgba(4,10,20,.92),rgba(4,10,20,.55) 70%,transparent)}
.brand{display:grid;gap:4px;min-width:0}
.brand h1{margin:0;font-family:var(--cjk);font-size:clamp(14px,1.5vw,19px);font-weight:700;letter-spacing:.06em;
  white-space:nowrap;text-shadow:0 0 18px rgba(69,230,245,.35)}
.brand h1 em{font-family:var(--mono);font-style:normal;font-weight:600;color:var(--cy);letter-spacing:.02em}
.brand p{margin:0;font-size:9px;letter-spacing:.16em;color:var(--dim);white-space:nowrap}
.brand p b{color:var(--gr);font-weight:500}

.run{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.pill{display:flex;align-items:center;gap:7px;height:24px;padding:0 9px;border:1px solid var(--hair2);
  font-size:9px;letter-spacing:.14em;color:var(--ink2);background:rgba(10,28,46,.5);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--gr);box-shadow:0 0 8px var(--gr);
  animation:beat 1.6s ease-in-out infinite}
.pill.paused i{background:var(--or);box-shadow:0 0 8px var(--or);animation:none}
.pill b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}

/* 宽度控件 */
.widths{display:flex;align-items:center;gap:3px;height:24px;padding:0 3px 0 8px;border:1px solid var(--hair2);
  background:rgba(10,28,46,.5);white-space:nowrap}
.widths .wk{font-family:var(--cjk);font-size:9px;letter-spacing:.1em;color:var(--dim);margin-right:3px}
.wb{font:600 9px/1 var(--mono);letter-spacing:.06em;color:var(--ink2);background:transparent;
  border:1px solid transparent;padding:3px 5px;cursor:pointer}
.wb:hover{color:var(--ink);border-color:var(--hair2)}
.wb.on{background:rgba(69,230,245,.16);border-color:rgba(69,230,245,.55);color:#d9feff}
.wb:focus-visible{outline:1px solid var(--cy);outline-offset:1px}
#wInfo{font-size:8.5px;letter-spacing:.06em;color:var(--mute);margin:0 4px 0 5px;font-weight:400;
  font-variant-numeric:tabular-nums}

.ctl{font:inherit;font-size:10px;letter-spacing:.1em;font-family:var(--cjk);color:var(--ink2);
  background:transparent;border:1px solid var(--hair2);padding:5px 10px;cursor:pointer;white-space:nowrap}
.ctl:hover{color:var(--ink);border-color:var(--cy);box-shadow:0 0 12px rgba(69,230,245,.18)}
.ctl:focus-visible{outline:1px solid var(--cy);outline-offset:2px}

/* ---------- 主舞台 ---------- */
main{position:relative;min-height:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}

.tags{position:absolute;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap;
  font-size:8.5px;letter-spacing:.14em;color:var(--mute)}
.tag b{display:block;font-size:9px;letter-spacing:.1em;color:var(--dim);font-weight:500;margin-bottom:3px}
.tag.on b{color:var(--cy);text-shadow:0 0 12px rgba(69,230,245,.5)}
.tag::after{content:"";display:block;width:1px;height:8px;margin:3px auto 0;background:var(--hair2)}

/* 输入参数列 */
.feats{position:absolute;left:0;top:0;height:100%;pointer-events:none;z-index:4}
.feat{position:absolute;left:0;display:flex;align-items:center;gap:6px;
  transform:translateY(-50%);transition:opacity .35s}
.feat .ft{display:grid;gap:0;min-width:0;flex:1}
.feat .ft b{font-size:9.5px;font-weight:600;letter-spacing:.01em;color:#b9d8e8;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.feat .ft i{font-family:var(--cjk);font-style:normal;font-size:8px;color:var(--dim);letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat .spk{display:block;width:52px;height:16px;flex:0 0 auto}
.feat .fv{font-size:9px;font-variant-numeric:tabular-nums;color:#7dffd0;width:52px;text-align:right;
  flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat.hot .ft b{color:var(--ink);text-shadow:0 0 10px rgba(69,230,245,.45)}
.feat.hot .fv{color:#bfffea}
/* 密集模式：节点多时压缩行内元素 */
.feats.dense .feat .ft i{display:none}
.feats.dense .feat .spk{width:32px;height:10px}
.feats.dense .feat .ft b{font-size:8.5px}
.feats.dense .feat .fv{font-size:8.5px;width:56px}
.feats.xdense .feat .spk{width:28px;height:9px}
.feats.xdense .feat .ft b{font-size:8.2px;letter-spacing:0}
.feats.xdense .feat .fv{font-size:8.2px;width:58px}

/* 推理轨迹 */
.trace{position:absolute;right:14px;top:14px;bottom:16px;width:min(308px,32%);z-index:5;
  display:flex;flex-direction:column;min-height:0;
  background:linear-gradient(160deg,rgba(6,17,30,.9),rgba(5,12,22,.72));
  border:1px solid var(--hair);backdrop-filter:blur(7px);
  box-shadow:0 0 0 1px rgba(69,230,245,.06),0 18px 50px rgba(0,0,0,.45)}
.th{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--hair);
  font-size:8.5px;letter-spacing:.14em;color:var(--dim);white-space:nowrap}
.th b{color:var(--ink2);font-weight:500;letter-spacing:.12em}
.th em{margin-left:auto;font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums}
.th .rec{width:5px;height:5px;border-radius:50%;background:var(--rd);box-shadow:0 0 7px var(--rd);animation:beat 1.2s infinite}
.tb{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:7px 10px 10px;display:flex;
  flex-direction:column;justify-content:flex-start;gap:1px}
.ln{font-size:9.5px;line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--dim);animation:slideIn .28s ease-out}
.ln .t{color:var(--mute);margin-right:6px}
.ln .k{color:var(--cy)}
.ln .g{color:var(--gr)}
.ln .o{color:var(--or)}
.ln .n{color:var(--ink2);font-variant-numeric:tabular-nums}
.ln.hd{color:var(--ink2);margin-top:3px}
.ln.res{color:var(--ink);font-weight:600;letter-spacing:.01em}
@keyframes slideIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

footer{position:relative;z-index:6;display:flex;align-items:center;gap:15px;flex-wrap:wrap;
  padding:8px 18px;border-top:1px solid var(--hair);font-size:8.5px;letter-spacing:.12em;color:var(--mute);
  background:linear-gradient(0deg,rgba(4,10,20,.92),transparent)}
footer span b{color:var(--ink2);font-weight:500;font-variant-numeric:tabular-nums}
footer .right{margin-left:auto;color:var(--mute)}
footer .right b{color:var(--dim)}

main::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(to bottom,rgba(120,220,255,.022) 0 1px,transparent 1px 3px)}
.vig{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(120% 100% at 40% 45%,transparent 45%,rgba(2,5,10,.55) 100%)}

#boot{position:absolute;inset:0;display:grid;place-items:center;z-index:9;background:var(--bg);
  color:var(--dim);font-size:10px;letter-spacing:.2em;transition:opacity .5s}
#boot.gone{opacity:0;pointer-events:none}

@media (max-width:1180px){
  .feat .spk{width:40px}
  .feat .fv{width:48px}
  #wInfo{display:none}
  .trace{width:min(268px,33%)}
}
@media (max-width:980px){
  .pill.hide-md{display:none}
}
@media (max-width:900px){
  .trace{top:10px;right:10px;bottom:10px;width:min(230px,34%)}
  .feat .ft i{display:none}
  .feat .ft b{font-size:9px}
}
@media (max-width:720px){
  .trace{display:none}
  header{padding:9px 12px}
  .brand p{display:none}
  .widths .wk{display:none}
  footer{padding:6px 12px;font-size:8px}
  .feat .spk{display:none}
  .feat .ft b{font-size:8.5px}
  .feat .fv{width:46px;font-size:8.5px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>神经网络推理 <em>NEURAL&nbsp;INFERENCE</em></h1>
      <p>LLM TRAINING PARAMS → FORWARD PASS → DIAGNOSIS · <b id="hStatus">LIVE</b></p>
    </div>
    <div class="run">
      <div class="widths" role="group" aria-label="网络宽度">
        <span class="wk">宽度</span>
        <button class="wb on" data-w="0" type="button" title="12 · 16 · 12">S</button>
        <button class="wb" data-w="1" type="button" title="18 · 22 · 16">M</button>
        <button class="wb" data-w="2" type="button" title="24 · 28 · 20">L</button>
        <button class="wb" data-w="3" type="button" title="28 · 28 · 24">XL</button>
        <b id="wInfo">12·16·12·8</b>
      </div>
      <div class="pill" id="hPill"><i></i><span id="hPhase">INPUT</span><b id="hStep">0000</b></div>
      <div class="pill hide-md"><span>LATENCY</span><b id="hLat">0.00ms</b></div>
      <button class="ctl" id="bPause" type="button">暂停</button>
      <button class="ctl" id="bSpeed" type="button">1.0×</button>
      <button class="ctl" id="bReset" type="button">重置</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="c" aria-label="大模型训练推理可视化：左侧训练参数经多层全连接网络，输出训练诊断结论"></canvas>
    <div class="tags" id="tags"></div>
    <div class="feats" id="feats"></div>

    <aside class="trace" id="trace">
      <div class="th"><span class="rec"></span><b>INFERENCE TRACE</b><span>推理轨迹</span><em id="tRate">0.0 Hz</em></div>
      <div class="tb" id="log"></div>
    </aside>
    <div class="vig"></div>
  </main>

  <footer>
    <span>PARAMS <b id="fP">—</b></span>
    <span>MAC <b id="fM">—</b></span>
    <span>DEPTH <b id="fD">3</b></span>
    <span>ACT <b>ReLU / Softmax</b></span>
    <span class="right">HOVER · 悬停节点查看取值 — <b>LLM TRAINING DIAGNOSTIC</b></span>
  </footer>
</div>
<div id="boot">INITIALIZING NEURAL CORE…</div>

<script>
(function () {
  'use strict';

  /* ================= 0. 基础 ================= */
  var $ = function (s) { return document.querySelector(s); };
  var TAU = Math.PI * 2;
  var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var CV = $('#c'), cx = CV.getContext('2d');
  var tagsEl = $('#tags'), featsEl = $('#feats'), logEl = $('#log');
  var W = 0, H = 0, DPR = 1;

  var seed = 20261022;
  function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  function gauss() { return (rnd() + rnd() + rnd() - 1.5) * 0.9; }
  function zeros(n) { var a = []; for (var i = 0; i < n; i++) a.push(0); return a; }

  /* ================= 1. 训练参数池（输入层） =================
     每项：v = 归一化观测值 0..1（送进网络），fmt(v) = 真实量纲显示 */
  var PARAMS = [
    { k: 'lr',     en: 'Learning Rate',  cn: '学习率',     v: 0.52,
      fmt: function (v) { return Math.pow(10, -6 + v * 4.3).toExponential(1); } },
    { k: 'loss',   en: 'Train Loss',     cn: '训练损失',   v: 0.42,
      fmt: function (v) { return (0.4 + v * 4.6).toFixed(2); } },
    { k: 'ppl',    en: 'Perplexity',     cn: '困惑度',     v: 0.42,
      fmt: function (v) { return Math.round(Math.exp(0.4 + v * 4.6)).toString(); } },
    { k: 'grad',   en: 'Grad Norm',      cn: '梯度范数',   v: 0.34,
      fmt: function (v) { return (v * 4).toFixed(2); } },
    { k: 'batch',  en: 'Batch Size',     cn: '批大小',     v: 0.55,
      fmt: function (v) { return Math.pow(2, 6 + Math.round(v * 5)).toString(); } },
    { k: 'seq',    en: 'Seq Length',     cn: '序列长度',   v: 0.45,
      fmt: function (v) { return Math.pow(2, 9 + Math.round(v * 7)).toLocaleString(); } },
    { k: 'warmup', en: 'Warmup Steps',   cn: '预热步数',   v: 0.38,
      fmt: function (v) { return Math.round(50 + v * 2000).toString(); } },
    { k: 'wd',     en: 'Weight Decay',   cn: '权重衰减',   v: 0.10,
      fmt: function (v) { return (v * 0.1).toFixed(3); } },
    { k: 'drop',   en: 'Dropout',        cn: '丢弃率',     v: 0.10,
      fmt: function (v) { return (v * 0.3).toFixed(2); } },
    { k: 'b1',     en: 'Adam Beta1',     cn: '一阶动量',   v: 0.45,
      fmt: function (v) { return (0.8 + v * 0.19).toFixed(3); } },
    { k: 'b2',     en: 'Adam Beta2',     cn: '二阶动量',   v: 0.95,
      fmt: function (v) { return (0.9 + v * 0.099).toFixed(4); } },
    { k: 'eps',    en: 'Adam Epsilon',   cn: '数值稳定项', v: 0.20,
      fmt: function (v) { return (1e-8 * (1 + v * 9)).toExponential(0); } },
    { k: 'accum',  en: 'Grad Accum',     cn: '梯度累积',   v: 0.10,
      fmt: function (v) { return (1 + Math.round(v * 31)).toString(); } },
    { k: 'clip',   en: 'Clip Norm',      cn: '裁剪阈值',   v: 0.50,
      fmt: function (v) { return (v * 2).toFixed(1); } },
    { k: 'gpu',    en: 'GPU Memory',     cn: '显存占用',   v: 0.62,
      fmt: function (v) { return (v * 100).toFixed(0) + '%'; } },
    { k: 'mfu',    en: 'MFU',            cn: '算力利用率', v: 0.42,
      fmt: function (v) { return (v * 70).toFixed(1) + '%'; } },
    { k: 'tps',    en: 'Tokens / s',     cn: '训练吞吐',   v: 0.50,
      fmt: function (v) { return Math.round(v * 2.4e6).toLocaleString(); } },
    { k: 'kv',     en: 'KV Cache',       cn: 'KV 缓存',    v: 0.40,
      fmt: function (v) { return (v * 100).toFixed(0) + '%'; } },
    { k: 'attn',   en: 'Attn Entropy',   cn: '注意力熵',   v: 0.55,
      fmt: function (v) { return (v * 4).toFixed(2); } },
    { k: 'router', en: 'Router Z-Loss',  cn: '路由损失',   v: 0.08,
      fmt: function (v) { return (v * 0.02).toFixed(4); } },
    { k: 'aux',    en: 'Aux Loss',       cn: '辅助损失',   v: 0.12,
      fmt: function (v) { return (v * 0.05).toFixed(4); } },
    { k: 'kl',     en: 'KL Divergence',  cn: 'KL 散度',    v: 0.20,
      fmt: function (v) { return (v * 0.2).toFixed(3); } },
    { k: 'ent',    en: 'Policy Entropy', cn: '策略熵',     v: 0.60,
      fmt: function (v) { return (v * 2).toFixed(2); } },
    { k: 'cr',     en: 'Clip Ratio',     cn: '裁剪比例',   v: 0.15,
      fmt: function (v) { return (v * 0.4).toFixed(3); } },
    { k: 'rew',    en: 'Reward Mean',    cn: '奖励均值',   v: 0.55,
      fmt: function (v) { return (v * 3).toFixed(2); } },
    { k: 'vl',     en: 'Value Loss',     cn: '价值损失',   v: 0.30,
      fmt: function (v) { return (v * 2).toFixed(2); } },
    { k: 'step',   en: 'Step Time',      cn: '单步耗时',   v: 0.40,
      fmt: function (v) { return Math.round(200 + v * 800) + 'ms'; } },
    { k: 'flops',  en: 'Total FLOPs',    cn: '累计算力',   v: 0.35,
      fmt: function (v) { return (v * 1e23).toExponential(1); } }
  ];
  PARAMS.forEach(function (p) {
    p.hist = [];
    for (var i = 0; i < 24; i++) p.hist.push(clamp(p.v + (rnd() - 0.5) * 0.1, 0.03, 0.97));
    p.hist[p.hist.length - 1] = p.v;
  });
  var PMAP = {};
  PARAMS.forEach(function (p) { PMAP[p.k] = p; });

  /* 输出层：训练诊断 */
  var OUTS = [
    { en: 'CONVERGING', cn: '收敛正常',   c: '#3ff0c0' },
    { en: 'LR TOO HIGH', cn: '学习率过高', c: '#ffb054' },
    { en: 'LR TOO LOW',  cn: '学习率过低', c: '#4f9dff' },
    { en: 'GRAD SPIKE',  cn: '梯度尖峰',   c: '#ff5f7e' },
    { en: 'OOM RISK',    cn: '显存风险',   c: '#ff5f7e' },
    { en: 'PLATEAU',     cn: '训练平台期', c: '#a06bff' },
    { en: 'UNDERFIT',    cn: '欠拟合',     c: '#45e6f5' },
    { en: 'OVERFIT',     cn: '过拟合',     c: '#ffd166' }
  ];
  var NOUT = OUTS.length;

  /* 宽度档位：[输入, FC1, FC2]，输出层固定 8 类诊断；任一不超过 28 */
  var WIDTHS = [
    { l: 'S',  dims: [12, 16, 12] },
    { l: 'M',  dims: [18, 22, 16] },
    { l: 'L',  dims: [24, 28, 20] },
    { l: 'XL', dims: [28, 28, 24] }
  ];
  var wIdx = 0, DIMS = [];
  function applyDims(i) {
    wIdx = clamp(i, 0, WIDTHS.length - 1);
    DIMS = WIDTHS[wIdx].dims.concat([NOUT]);
  }
  applyDims(0);

  /* ================= 2. 网络 ================= */
  var L1, L2, L3, PARAMS_N = 0;
  function mkLayer(n, m) {
    var w = [], b = [];
    for (var i = 0; i < n; i++) {
      var row = [];
      for (var j = 0; j < m; j++) row.push(gauss() * 1.15);
      w.push(row); b.push(gauss() * 0.12);
    }
    return { w: w, b: b, n: n, m: m };
  }
  function buildWeights() {
    L1 = mkLayer(DIMS[1], DIMS[0]);
    L2 = mkLayer(DIMS[2], DIMS[1]);
    L3 = mkLayer(DIMS[3], DIMS[2]);
    PARAMS_N = DIMS[1] * DIMS[0] + DIMS[1] + DIMS[2] * DIMS[1] + DIMS[2] + DIMS[3] * DIMS[2] + DIMS[3];
  }

  var act = { x: [], h1: [], h2: [], y: [] };
  function relu(v) { return v > 0 ? v : 0; }
  function forward(layer, input) {
    var out = [];
    for (var i = 0; i < layer.n; i++) {
      var s = layer.b[i], w = layer.w[i];
      for (var j = 0; j < layer.m; j++) s += w[j] * input[j];
      out.push(s);
    }
    return out;
  }
  function softmax(v) {
    var mx = Math.max.apply(null, v), e = v.map(function (x) { return Math.exp(x - mx); });
    var s = e.reduce(function (a, b) { return a + b; }, 0);
    return e.map(function (x) { return x / s; });
  }

  /* 训练状态规则 → 输出层 logits 偏置（让诊断与参数状态一致） */
  var lossHist = [];

    var b = zeros(NOUT), g = PMAP.grad.v, gpu = PMAP.gpu.v, lr = PMAP.lr.v, loss = PMAP.loss.v;
    var trend = 0;
    if (lossHist.length > 5) trend = lossHist[lossHist.length - 1] - lossHist[lossHist.length - 6];
    if (gpu > 0.86) b[4] += 2.8;
    if (g > 0.78) b[3] += 2.4;
    if (lr > 0.84) b[1] += 2.0;
    if (lr < 0.16) b[2] += 2.0;
    if (Math.abs(trend) < 0.006 && loss > 0.32) b[5] += 1.7;
    if (loss > 0.78) b[6] += 1.4;

    for (i = 0; i < lg.length; i++) lg[i] = (lg[i] - m) / sd * 1.1 + rb[i] * 0.38;
    act.y = softmax(lg);

  function sampleInput() { act.x = PARAMS.slice(0, DIMS[0]).map(function (p) { return p.v; }); }

        if (p.v < 0.075) p.v = 0.55 + rnd() * 0.2;
      } else if (p.k === 'ppl') {

      } else if (p.k === 'grad') {

      } else if (p.k === 'lr' || p.k === 'gpu' || p.k === 'mfu') {
        p.v = clamp(p.v + (rnd() - 0.5) * 0.035, 0.05, 0.95);
      } else {
        p.v = clamp(p.v + d, 0.05, 0.95);
      }
      p.hist.push(p.v);
      if (p.hist.length > 24) p.hist.shift();

    if (lossHist.length > 40) lossHist.shift();

  /* ================= 3. 几何 ================= */
  var LS = [], R = 0, EDGES = [], tagEls = [];

  function layout() {
    W = CV.clientWidth || 1; H = CV.clientHeight || 1;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    CV.width = Math.round(W * DPR); CV.height = Math.round(H * DPR);
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var narrow = W < 900;
    var traceEl = $('#trace');
    var tw = traceEl && traceEl.offsetParent !== null ? traceEl.offsetWidth + 22 : 0;
    R = Math.max(320, W - tw);
    var xs = narrow ? [0.30, 0.50, 0.69, 0.86] : [0.29, 0.50, 0.69, 0.86];

    LS = [];
    for (var li = 0; li < 4; li++) {
      var n = DIMS[li];
      var span = H * (li === 0 ? 0.76 : li === 3 ? 0.44 : 0.68);
      var gap = Math.min(li === 0 ? 44 : li === 3 ? 58 : 40, span / Math.max(1, n - 1));
      var y0 = H * 0.5 - (n - 1) * gap / 2;
      var ys = [];
      for (var i = 0; i < n; i++) ys.push(y0 + i * gap);
      LS.push({ n: n, x: R * xs[li], ys: ys, gap: gap });
    }

    EDGES = [];
    for (var a = 0; a < 3; a++) {
      var LAY = [L1, L2, L3][a], from = LS[a], to = LS[a + 1];
      for (var ii = 0; ii < from.n; ii++) {
        for (var jj = 0; jj < to.n; jj++) {
          EDGES.push({ a: a, i: ii, j: jj, w: LAY.w[jj][ii] });
        }

    }

    buildFeats();
    buildTags();
    geoDirty = true;
  }

  function buildTags() {

    var names = [
      ['INPUT', '训练参数'],
      ['FC1', '全连接 · ReLU'],
      ['FC2', '全连接 · ReLU'],
      ['OUT', '诊断 · Softmax']
    ];
    LS.forEach(function (L, li) {
      var d = document.createElement('div');
      d.className = 'tag';
      d.style.left = L.x + 'px';
      d.style.top = Math.max(6, L.ys[0] - (li === 0 ? 40 : 36)) + 'px';
      d.innerHTML = '<b>' + names[li][0] + ' ' + DIMS[li] + '</b>' + names[li][1];
      tagsEl.appendChild(d);
      tagEls.push(d);
    });
  }

  function buildFeats() {
    featsEl.innerHTML = '';

    var colW = Math.max(150, L.x - 40);
    var rowH = clamp(18, (H * 0.78) / n0, 40);

    for (var i = 0; i < n0; i++) {

      row.style.height = rowH + 'px';
      row.style.width = colW + 'px';
      row.style.paddingLeft = '14px';
      row.innerHTML = '<div class="ft"><b>' + p.en + '</b><i>' + p.cn + '</i></div>' +

  function syncFeats() {
    for (var i = 0; i < DIMS[0]; i++) {
      var f = PARAMS[i];
      if (!f.el) continue;
      f.fv.textContent = f.fmt(f.v);
      var c = f.sctx, w = f.spk.width, h = f.spk.height;
      c.clearRect(0, 0, w, h);
      var n = f.hist.length, step = w / 23;
      c.strokeStyle = 'rgba(90,180,220,.16)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(0, h - 1); c.lineTo(w, h - 1); c.stroke();
      c.strokeStyle = 'rgba(90,180,220,.09)';
      c.beginPath(); c.moveTo(0, h * 0.5); c.lineTo(w, h * 0.5); c.stroke();

      var pts = [];
      for (var k = 0; k < n; k++) pts.push([k * step, h - 2 - f.hist[k] * (h - 5)]);
      var area = c.createLinearGradient(0, 0, 0, h);
      area.addColorStop(0, 'rgba(63,240,192,.26)');
      area.addColorStop(1, 'rgba(63,240,192,0)');
      c.fillStyle = area;

    g.addColorStop(0, 'rgba(14,46,80,.60)');

    cx.strokeStyle = 'rgba(90,190,230,.075)'; cx.lineWidth = 1;
    var hz = H * 0.80;
    for (var i = 1; i <= 12; i++) {

    }
    cx.globalAlpha = 1;

    var scanX = (((t * 0.075) % 1.5) - 0.2) * R;
    var sg = cx.createLinearGradient(scanX - 70, 0, scanX + 70, 0);
    sg.addColorStop(0, 'rgba(69,230,245,0)');
    sg.addColorStop(0.5, 'rgba(69,230,245,.06)');

    cx.fillRect(scanX - 70, 0, 140, H);

    if (geoDirty) buildPaths();

      cx.lineWidth = 0.75;

      cx.stroke(cold);

      var xy = bezPoint(ep, pt.u), xp = bezPoint(ep, Math.max(0, pt.u - 0.12));
      var grd = cx.createLinearGradient(xp[0], xp[1], xy[0], xy[1]);
      grd.addColorStop(0, pt.hue === 'red' ? 'rgba(255,95,126,0)' : 'rgba(69,230,245,0)');
      grd.addColorStop(1, pt.hue === 'red' ? 'rgba(255,120,150,.85)' : 'rgba(150,255,235,.95)');
      cx.strokeStyle = grd; cx.lineWidth = 1.5; cx.lineCap = 'round';
      cx.beginPath(); cx.moveTo(xp[0], xp[1]); cx.lineTo(xy[0], xy[1]); cx.stroke();
      cx.fillStyle = pt.hue === 'red' ? 'rgba(255,190,205,.95)' : 'rgba(210,255,245,.98)';

        if (hot > 0.12) {

        cx.fillStyle = OUTS[i].c;

        cx.fillStyle = 'rgba(220,245,255,.78)';

  /* ================= 6. 文字面板 ================= */

  function pushBoot() {
    var rows = [
      '<div class="ln hd"><span class="t">boot</span><span class="k">llm-train-diagnostic</span> v3.0</div>',
      '<div class="ln"><span class="t">├</span>width <span class="n">' + DIMS.join(' → ') + '</span> · params <span class="g">' + PARAMS_N + '</span></div>',
      '<div class="ln"><span class="t">├</span>inputs <span class="n">' + DIMS[0] + '</span> training metrics · outputs <span class="n">8</span> diagnostics</div>',
      '<div class="ln"><span class="t">└</span>activation <span class="n">ReLU</span> · output <span class="n">Softmax</span></div>'
    ];
    for (var i = 0; i < rows.length; i++) pushLine(rows[i]);
  }
  function pushRun() {
    var ms = (0.18 + rnd() * 0.7).toFixed(2);
    var lr = PMAP.lr.fmt(PMAP.lr.v), loss = PMAP.loss.fmt(PMAP.loss.v);
    var rows = [
      '<div class="ln hd"><span class="t">#' + stamp() + '</span><span class="k">forward</span>(x) · step ' +
        (1000 + stepNo) + ' · lr ' + lr + ' · loss ' + loss + '</div>',
      '<div class="ln"><span class="t">├</span>h1 = <span class="k">relu</span>(W1·x + b1) ' +
        '<span class="n">' + DIMS[0] + '×' + DIMS[1] + '</span> <span class="g">' + ms + 'ms</span></div>',
      '<div class="ln"><span class="t">├</span>h2 = <span class="k">relu</span>(W2·h1 + b2) ' +
        '<span class="n">' + DIMS[1] + '×' + DIMS[2] + '</span></div>',
      '<div class="ln"><span class="t">└</span>y = <span class="k">softmax</span>(W3·h2 + b3) ' +
        '<span class="n">' + DIMS[2] + '×' + DIMS[3] + '</span></div>',
      '<div class="ln res"><span class="t">→</span>diagnosis <span class="o">' + OUTS[best].en + '</span>' +
        ' <span class="n">' + (act.y[best] * 100).toFixed(1) + '%</span>' +
        ' <span class="g">Δ ' + (latency || 0.4).toFixed(2) + 'ms</span></div>'
    ];
    for (var i = 0; i < rows.length; i++) pushLine(rows[i]);
  }

  function updateHUD() {
    var ph = phase < STAGE[1][0] ? 'INPUT' : phase < STAGE[2][0] ? 'HIDDEN 1' :
      phase < STAGE[3][0] ? 'HIDDEN 2' : 'OUTPUT';
    $('#hPhase').textContent = ph;
    $('#hStep').textContent = ('0000' + stepNo).slice(-4);
    $('#hLat').textContent = ((latency || 0.4) + 0.1 * rnd()).toFixed(2) + 'ms';
    $('#fP').textContent = PARAMS_N;
    $('#fM').textContent = (PARAMS_N / 1000).toFixed(2) + 'K';
    $('#fD').textContent = '3';
    for (var i = 0; i < tagEls.length; i++) tagEls[i].classList.toggle('on', glow(i) > 0.65);
    for (var f = 0; f < DIMS[0]; f++) {
      if (PARAMS[f].el) PARAMS[f].el.classList.toggle('hot', f_energy(f) > 0.5);
    }
  }

  /* ================= 7. 主循环 ================= */
  var last = performance.now(), hudAcc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    tick(dt);
    draw();
    hudAcc += dt;
    if (hudAcc > 0.12) { hudAcc = 0; updateHUD(); }
  }

  /* ================= 8. 交互 ================= */
  var bPause = $('#bPause'), bSpeed = $('#bSpeed');
  bPause.addEventListener('click', function () {
    paused = !paused;
    bPause.textContent = paused ? '继续' : '暂停';
    $('#hStatus').textContent = paused ? 'HOLD' : 'LIVE';
    $('#hPill').classList.toggle('paused', paused);
  });
  var SP = [1, 2, 4, 0.5], si = 0;
  bSpeed.addEventListener('click', function () {
    si = (si + 1) % SP.length;
    speed = SP[si];
    bSpeed.textContent = speed.toFixed(1) + '×';
  });

  /* 宽度控件 */
  var wBtns = Array.prototype.slice.call(document.querySelectorAll('.wb'));
  function setWidth(i, quiet) {
    applyDims(i);
    buildWeights();
    sampleInput();
    curOut = infer();
    phase = 0;
    parts.length = 0;
    ripples.length = 0;
    layout();
    buildPaths();
    wBtns.forEach(function (b) { b.classList.toggle('on', +b.dataset.w === wIdx); });
    $('#wInfo').textContent = DIMS[0] + '·' + DIMS[1] + '·' + DIMS[2] + '·' + DIMS[3];
    if (!quiet) { logEl.innerHTML = ''; pushBoot(); pushRun(); }
  }
  wBtns.forEach(function (b) {
    b.addEventListener('click', function () { setWidth(+b.dataset.w); });
  });

  $('#bReset').addEventListener('click', function () {
    seed = 20261022;
    buildWeights();
    stepNo = 0; phase = 0; t = 0;
    parts.length = 0; ripples.length = 0;
    lossHist.length = 0;
    PARAMS.forEach(function (p) {
      p.v = clamp(p.v * 0.4 + 0.15 + rnd() * 0.35, 0.08, 0.9);
      p.hist = [];
      for (var i = 0; i < 24; i++) p.hist.push(clamp(p.v + (rnd() - 0.5) * 0.1, 0.03, 0.97));
    });
    sampleInput();
    curOut = infer();
    syncFeats();
    logEl.innerHTML = '';
    pushBoot(); pushRun();
  });

  /* 悬停节点 */
  var tipEl = null;
  CV.addEventListener('pointermove', function (ev) {
    var r = CV.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
    var hit = null;
    for (var li = 0; li < 4 && !hit; li++) {
      var L = LS[li], tol = Math.max(6, Math.min(9, L.gap * 0.42));
      for (var i = 0; i < L.n; i++) {
        if (Math.abs(mx - L.x) < tol && Math.abs(my - L.ys[i]) < tol) { hit = { li: li, i: i }; break; }
      }
    }
    if (hit) {
      if (!tipEl) {
        tipEl = document.createElement('div');
        tipEl.style.cssText = 'position:absolute;z-index:8;pointer-events:none;font:9px/1.5 ui-monospace,monospace;' +
          'color:#dcf3ff;background:rgba(6,16,28,.94);border:1px solid rgba(69,230,245,.35);padding:5px 8px;white-space:nowrap';
        document.getElementById('stage').appendChild(tipEl);
      }
      var nm, sub, val;
      if (hit.li === 0) {
        var pp = PARAMS[hit.i];
        nm = pp.en + ' ' + pp.cn; sub = '训练参数 · 归一化'; val = pp.fmt(pp.v);
      } else if (hit.li === 3) {
        nm = OUTS[hit.i].en + ' ' + OUTS[hit.i].cn; sub = 'softmax 诊断概率';
        val = (act.y[hit.i] * 100).toFixed(1) + '%';
      } else {
        nm = 'h' + hit.li + '[' + hit.i + ']'; sub = '激活值'; val = nodeVal(hit.li, hit.i).toFixed(3);
      }
      tipEl.innerHTML = nm + ' <b style="color:#3ff0c0">' + val + '</b>' +
        '<br><span style="color:#5f8199">' + sub + '</span>';
      tipEl.style.left = (LS[hit.li].x + 14) + 'px';
      tipEl.style.top = (LS[hit.li].ys[hit.i] - 10) + 'px';
      tipEl.style.display = 'block';
    } else if (tipEl) tipEl.style.display = 'none';
  });
  CV.addEventListener('pointerleave', function () { if (tipEl) tipEl.style.display = 'none'; });

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); bPause.click(); }
  });

  /* ================= 9. 启动 ================= */
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function () { layout(); });
    ro.observe(document.getElementById('stage'));
  } else {
    window.addEventListener('resize', layout);
  }

  buildWeights();
  sampleInput();
  layout();
  curOut = infer();
  stepNo = 0;
  pushBoot(); pushRun();
  setTimeout(function () { $('#boot').classList.add('gone'); }, 260);
  requestAnimationFrame(frame);

  window.__NN = {
    get state() {
      return {
        phase: phase, step: stepNo, out: best, y: act.y.slice(),
        paused: paused, speed: speed, parts: parts.length,
        dims: DIMS.slice(), wIdx: wIdx, params: PARAMS_N,
        pathLens: path ? [path[0].length, path[1].length, path[2].length] : null,
        xs: LS.map(function (l) { return Math.round(l.x); }),
        glow: [glow(0), glow(1), glow(2), glow(3)]
      };
    },
    setWidth: function (i) { setWidth(i); return DIMS.slice(); },
    forward: function () { curOut = infer(); return act.y.slice(); }
  };
})();
</script>
<script>
(function(){
  document.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    try { parent.postMessage({ hlEmbed: "esc" }, "*"); } catch (err) {}
  }, true);
})();
</script>
</body>
</html>
