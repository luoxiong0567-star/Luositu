<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人类之光 · HUMAN LIGHT</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/katex.css">
<script>
/* 线上分享入口转发
   云端分享链接带 ?sharecode= 且只对首个请求放行，页面里的 css/js 子请求会被网关
   403 拦掉，整站会退化成无样式的裸 HTML。因此线上统一转到单文件自包含入口
   single.html（全部资源内联，只有一次请求，天然带 sharecode）。
   本地 file:// 打开没有 sharecode、且单文件自身路径以 single.html 结尾，均不会跳转。 */
(function () {
  if (!/[?&]sharecode=/.test(location.search)) return;
  if (/single\.html/.test(location.pathname)) return;
  location.replace('single.html' + location.search + location.hash);
})();
</script>
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <div class="brand">
      <div class="logo">✦</div>
      <div class="brand-text">
        <h1>人类之光</h1>
        <p>HUMAN LIGHT</p>
      </div>
    </div>
    <button id="galleryBtn" title="场景目录（Esc）">☰ 场景目录</button>
    <nav id="sceneList"></nav>
    <div class="author">
      <span class="author-label">作者</span>
      <span class="author-name">罗司徒</span>
    </div>
    <div class="sidebar-foot">
      <span id="fps">-- FPS</span>
      <span id="gpuState">WebGL</span>
    </div>
  </aside>

  <main id="stage">
    <canvas id="gl"></canvas>

    <div id="titlebar">
      <h2 id="sceneTitle">—</h2>
      <p id="sceneDesc">—</p>
    </div>

    <div id="panel"></div>
    <div id="tooltip"></div>

    <div id="gallery"></div>

    <div id="hint">
      <span><b>左键</b> 平移</span>
      <span><b>滚轮</b> 缩放</span>
      <span><b>右键</b> 旋转</span>
      <span><b>R</b> 复位视角</span>
    </div>
  </main>

  <!-- 窄屏：侧栏改为抽屉式，用这颗浮动按钮唤出 -->
  <button id="mobileMenu" aria-label="打开场景目录" title="场景目录">☰</button>
  <div id="scrim"></div>

</div>

<script src="vendor/three.min.js"></script>
